<!DOCTYPE html>
<html lang="pt-br" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | SwiftStore</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

    <header>
        <h1>
            <a href="index.html">
                <span class="swift-azul">Sw<span class="seta-azul">↑</span>ft</span><span class="store-laranja">Store</span>
            </a>
        </h1>
        
        <div class="header-acoes">
            <button id="perfil" class="btn-icone" title="Meu Perfil">
                <span class="material-symbols-outlined">account_circle</span>
            </button>
            <a href="carrinho.html" id="carrinho" class="bts-canto" title="Meu Carrinho">
                <span class="material-symbols-outlined">shopping_cart</span>
            </a>
            <span class="usuario-nome">João Lucas S. P. Pinheiro</span>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <!-- Atualizado para .html -->
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contatos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="cabecalho-filtro">
            <h2>Catálogo de Produtos</h2>
            <form method="GET" action="produtos.html" class="form-filtro">
                <label for="filtro-categoria">Filtrar:</label>
                <select name="categoria" id="filtro-categoria" class="select-filtro">
                    <option value="Todos">Todas as Categorias</option>
                    <option value="Processador">Processador (CPU)</option>
                    <option value="Placa mãe">Placas Mãe</option>
                    <option value="Memória RAM">Memórias RAM</option>
                    <option value="SSD">Armazenamento (SSD)</option>
                    <option value="Fonte">Fontes</option>
                    <option value="Placas de Vídeo">Placas de Vídeo (GPU)</option>
                    <option value="Gabinete">Gabinetes</option>
                    <option value="Monitor">Monitores</option>
                    <option value="Mouse">Mouses</option>
                    <option value="Teclado">Teclados</option>
                    <option value="Caixa de som">Headsets / Áudio</option>
                </select>
                <button type="submit" class="btn-buscar-filtro" onclick="alert('Filtro visual configurado para o portfólio. No GitHub Pages os dados são estáticos.')">
                    <span class="material-symbols-outlined">search</span> BUSCAR
                </button>
            </form>
        </div>

    <!-- O PALCO DO JAVASCRIPT: Esta div precisa estar vazia! -->
    <div id="vitrine-produtos-js">
        <!-- É aqui que o JavaScript vai injetar todos os 16 produtos automaticamente ao carregar a página -->
    </div>

</section>
    </main>

    <footer class="footer-swiftstore">
        <section class="aviso-legal"><p>Preços e condições de pagamento exclusivos para compras via internet. Ofertas válidas até o término dos nossos estoques.</p></section>
        <div class="footer-logo"><span class="swift-azul">Sw<span class="seta-azul">↑</span>ft</span><span class="store-laranja">Store</span></div>
        <p class="footer-texto">Desenvolvido por <span class="destaque-nome">João Lucas</span>.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
